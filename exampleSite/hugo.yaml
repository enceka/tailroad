baseURL: "/"
title: TailRoad
languageCode: en-US
theme: TailRoad

# This is required for TailWindCSS to cleanup ununsed css styles
# Refer to this link https://gohugo.io/functions/css/tailwindcss/  
build:
  buildStats:
    enable: true
  cachebusters:
  - source: assets/notwatching/hugo_stats\.json
    target: css
  - source: (postcss|tailwind)\.config\.js
    target: css
module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json

params:
  mainSections: ['posts']

outputs:
  home: ['html', 'rss', 'json']
